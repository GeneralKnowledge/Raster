[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raster-to-svg"
version = "0.1.0"
description = "REST API that converts raster images to SVG using VTracer 1.x"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "Pillow>=10.4.0,<12.0.0",
  "numpy>=1.26.0",
  "vtracer==1.0.0a4",
  "scour>=0.38.2",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]
quality = [
  "cairosvg>=2.7.0",
  "scikit-image>=0.24.0",
  "numpy>=1.26.0",
]
bg = [
  "rembg[cpu]>=2.0.50",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
